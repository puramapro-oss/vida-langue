name: Mobile · EAS build & submit

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile (development | preview | production)'
        required: true
        default: 'preview'
      submit:
        description: 'Submit to stores after build (true/false)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Forbid web globals outside Platform.OS
        run: |
          set -e
          MATCHES=$(grep -rn "window\.\|document\.\|localStorage\." src app --include="*.ts" --include="*.tsx" | grep -v "Platform.OS" | grep -v "// allow-web" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Web-only globals found outside Platform.OS guard:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          eas build --non-interactive --no-wait --platform all --profile "$PROFILE"

      - name: EAS submit (production only)
        if: ${{ github.event.inputs.submit == 'true' || github.ref == 'refs/heads/main' }}
        env:
          PROFILE: ${{ github.event.inputs.profile || 'production' }}
        run: |
          if [ "$PROFILE" = "production" ]; then
            eas submit --non-interactive --platform all --latest || echo "Submit failed (likely missing credentials)"
          fi
